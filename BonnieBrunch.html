<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>兔兔開心早午餐 mobile v4</title>
<style>
  :root{
    --bg:#fff7e8; --panel:#fffdf7; --pink:#ff9fbc; --pink2:#ffd7e3; --mint:#aee8d7;
    --yellow:#ffe28a; --brown:#8b5a3c; --blue:#a7d8ff; --green:#b9e88b; --red:#ff8b8b;
    --shadow: 0 8px 18px rgba(120,80,40,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  body{margin:0;font-family:"Microsoft JhengHei", system-ui, sans-serif;background:linear-gradient(#fff4dc,#ffeef6);color:#6d4328;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:100vh;}
  #game{width:40vw;min-width:520px;max-width:760px;height:100vh;display:flex;flex-direction:column;position:relative;background:#fff7e8;box-shadow:0 0 0 6px rgba(255,255,255,.65),0 12px 36px rgba(120,80,40,.22);overflow:hidden;}
  .topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#fffaf0;border-bottom:4px solid #ffe1b5;box-shadow:0 2px 8px rgba(0,0,0,.06);z-index:5;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;color:#8b4a2c;}
  .bunnyLogo{width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid #ffadc5;position:relative;box-shadow:var(--shadow);}
  .bunnyLogo:before,.bunnyLogo:after{content:"";position:absolute;width:13px;height:28px;background:#fff;border:3px solid #ffadc5;border-radius:14px;top:-22px;}
  .bunnyLogo:before{left:7px;transform:rotate(-12deg)} .bunnyLogo:after{right:7px;transform:rotate(12deg)}
  .hud{display:flex;gap:10px;align-items:center;font-weight:800;font-size:17px;}
  .pill{background:#fff;border:3px solid #ffd39b;border-radius:22px;padding:6px 12px;box-shadow:0 3px 0 #f0bc7d;white-space:nowrap;}
  .incomePill{font-size:23px;padding:7px 14px;border-color:#ffc05c;box-shadow:0 4px 0 #d89b44;background:#fffdf2;}
  .incomePill #score{font-size:30px;color:#2d9a57;font-weight:1000;}
  .main{flex:1;display:grid;grid-template-rows:34% 28% 38%;min-height:0;}
  .customers{position:relative;background:linear-gradient(#bde9ff 0 55%,#d9f7cf 56% 100%);border-bottom:4px solid #b6e0a3;overflow:hidden;}
  .sun{position:absolute;right:40px;top:24px;width:58px;height:58px;background:#ffe56f;border-radius:50%;box-shadow:0 0 0 10px rgba(255,229,111,.25);} 
  .cloud{position:absolute;left:70px;top:25px;width:90px;height:32px;background:white;border-radius:30px;opacity:.9;}
  .cloud:before,.cloud:after{content:"";position:absolute;background:white;border-radius:50%;}.cloud:before{width:42px;height:42px;left:12px;top:-20px}.cloud:after{width:35px;height:35px;left:45px;top:-14px}
  #customerRow{position:absolute;left:2%;right:2%;bottom:8px;display:flex;justify-content:center;gap:12px;align-items:flex-end;}
  .customer{width:18%;max-width:130px;min-width:80px;position:relative;text-align:center;transition:.2s;}
  .orderBubble{position:absolute;left:50%;top:-68px;transform:translateX(-50%);background:white;border:3px solid #ffcf87;border-radius:16px;padding:6px;min-width:78px;min-height:48px;box-shadow:var(--shadow);font-size:26px;display:flex;align-items:center;justify-content:center;gap:3px;}
  .orderBubble:after{content:"";position:absolute;bottom:-10px;left:40%;border-width:10px 8px 0 8px;border-style:solid;border-color:#ffcf87 transparent transparent transparent;}
  .patience{height:10px;background:#fff4e8;border-radius:10px;border:2px solid white;overflow:hidden;margin:3px auto 3px;width:78%;box-shadow:0 2px 0 rgba(120,80,40,.10);}
  .patience span{display:block;height:100%;width:100%;transition:width .2s;background:#79d772;}
  .patience.green span{background:#79d772;}
  .patience.yellow span{background:#ffd85c;}
  .patience.red span{background:#ff7777;}
  .animal{touch-action:manipulation;font-size:58px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.08));cursor:pointer;line-height:1;}
  .animal:hover{transform:translateY(-2px)}
  .custName{background:#fff;border:2px solid #ffd3a2;border-radius:12px;font-size:13px;font-weight:800;padding:1px 4px;display:inline-block;}
  .truck{position:relative;background:#fff4db;display:flex;align-items:center;justify-content:center;gap:16px;border-bottom:4px solid #ffd39b;overflow:hidden;}
  .bunnyChef{width:105px;text-align:center;font-size:58px;animation:bob 2s infinite ease-in-out;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .speech{position:absolute;left:18px;top:10px;background:white;border:3px solid #ffd39b;border-radius:18px;padding:8px 12px;font-weight:900;color:#8b4a2c;box-shadow:var(--shadow);max-width:280px;}
  .plates{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:70%;}
  .plate{touch-action:manipulation;width:72px;height:72px;border-radius:18px;background:#fff;border:3px solid #d7c9ff;box-shadow:0 4px 0 #b8a8ee;display:flex;align-items:center;justify-content:center;font-size:34px;cursor:pointer;position:relative;}
  .plate.selected{outline:5px solid #ff8db3;transform:scale(1.06)}
  .plate .small{position:absolute;right:4px;bottom:2px;font-size:14px;background:#ffefb0;border-radius:8px;padding:0 4px;font-weight:bold;}
  .workshop{background:linear-gradient(#fffdf7,#fff1dc);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;overflow:auto;}
  .section{background:rgba(255,255,255,.85);border:3px solid #ffd9ad;border-radius:22px;padding:8px;box-shadow:var(--shadow);min-height:0;}
  .sectionTitle{font-weight:900;font-size:16px;margin-bottom:6px;color:#8b4a2c;}
  .buttons{display:flex;gap:8px;flex-wrap:wrap;}
  button{touch-action:manipulation;font-family:inherit;border:0;border-radius:18px;background:#fff;box-shadow:0 4px 0 #d7b380;border:3px solid #ffcd87;color:#75472c;font-weight:900;font-size:16px;padding:8px 10px;cursor:pointer;min-height:46px;}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #d7b380;}
  .soundBtn{min-height:38px;width:44px;padding:4px;border-radius:16px;background:#fff8cc;border-color:#ffe28a;box-shadow:0 4px 0 #e6c85a;font-size:20px;}
  button.locked{filter:grayscale(1);opacity:.45;pointer-events:none;}
  .machine{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#fff7ef;border:2px dashed #ffc98d;border-radius:16px;padding:6px;margin-bottom:6px;}
  .machineName{font-weight:900;min-width:76px;}
  .progress{flex:1;height:16px;border-radius:12px;background:#eadbc8;overflow:hidden;border:2px solid white;}
  .progress span{display:block;height:100%;width:0;background:#ffd85c;transition:width .1s linear;}
  .machine.idle .progress span{background:#eadbc8;width:0!important;}
  .machine.cook .progress span{background:#ffd85c;}
  .machine.ready .progress span{background:#79d772;width:100%!important;}
  .machine.burn .progress span{background:#94624b;width:100%!important;}
  .takeBtn{min-width:58px;padding:5px 8px;font-size:14px;min-height:34px;background:#fff;}
  .takeBtn.idle{background:#fff;border-color:#ffcd87;box-shadow:0 4px 0 #d7b380;color:#75472c;}
  .takeBtn.cook{background:#fff0a6;border-color:#ffd85c;box-shadow:0 4px 0 #d8b54a;color:#7a5b00;}
  .takeBtn.ready{background:#c8f5bd;border-color:#79d772;box-shadow:0 4px 0 #55ad4f;color:#2c6b2e;}
  .takeBtn.burn{background:#a97855;border-color:#94624b;box-shadow:0 4px 0 #6e4836;color:#fffdf7;}
  .bigBtn.disabled{filter:grayscale(1);opacity:.45;pointer-events:none;background:#ddd;border-color:#bbb;box-shadow:0 5px 0 #aaa;color:#777;}
  .statsWrap{margin:12px auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:210px;overflow:auto;text-align:left;}
  .statCard{background:#fff7e8;border:3px solid #ffd9ad;border-radius:16px;padding:8px;font-weight:900;display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;}
  .statIcon .foodSvg{width:40px;height:40px;}
  .statName{color:#8b4a2c;font-size:14px;}
  .statNums{grid-column:1 / span 2;display:flex;justify-content:space-between;gap:5px;font-size:13px;}
  .soldNum{color:#2d9a57}.failNum{color:#e05252}.burnNum{color:#7a4b2d}
  .toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:#fff;border:4px solid #ffb4cc;border-radius:26px;padding:18px 26px;font-size:28px;font-weight:900;color:#ff6597;box-shadow:var(--shadow);z-index:30;animation:pop .8s ease forwards;pointer-events:none;text-align:center;}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(1)}}
  .modal{position:absolute;inset:0;background:rgba(90,60,35,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .card{background:#fffdf7;border:5px solid #ffbdd1;border-radius:30px;box-shadow:var(--shadow);padding:24px;max-width:620px;width:min(95vw,620px);text-align:center;}
  .card h1{margin:0 0 10px;color:#ff6c9b;font-size:34px}.card p{font-size:18px;line-height:1.6;font-weight:700}.stars{font-size:42px;letter-spacing:8px;margin:14px}.bigBtn{background:#ffbdd1;border-color:#ff8db3;box-shadow:0 5px 0 #d9789a;font-size:22px;padding:12px 22px;margin:6px;}
  .levelGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.levelBtn{padding:10px 6px;font-size:15px;}
  .hint{font-size:14px;color:#9a7154}.recipe{font-size:14px;text-align:left;background:#fff3dd;border-radius:18px;padding:10px;margin:10px auto;max-width:440px;}

  .foodSvg{width:46px;height:46px;display:inline-block;vertical-align:middle;}
  .orderBubble .foodSvg{width:44px;height:44px;}
  .orderBubble.combo{min-width:104px;max-width:150px;flex-wrap:wrap;gap:1px;line-height:1;}
  .orderBubble.combo .foodSvg{width:38px;height:38px;}
  .customer .patience{order:3;}
  .moneyPop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#2d9a57;background:#fffdf7;border:3px solid #9ee6c5;border-radius:18px;padding:6px 12px;box-shadow:var(--shadow);z-index:31;animation:moneyUp .9s ease forwards;pointer-events:none;}
  @keyframes moneyUp{0%{opacity:0;transform:translate(-50%,-35%) scale(.75)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-95%) scale(1)}}
  .plate .foodSvg{width:58px;height:58px;}
  .btnIcon{display:inline-flex;align-items:center;gap:6px;}
  .btnIcon .foodSvg{width:28px;height:28px;}
  .tinyIcon{width:22px;height:22px;display:inline-block;vertical-align:-5px;}
  svg.foodSvg *{vector-effect:non-scaling-stroke;}
  .previewGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;text-align:left}.previewBox{background:#fff7e8;border:3px solid #ffd9ad;border-radius:18px;padding:10px;font-weight:800}.previewBox b{color:#8b4a2c}.previewList{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.previewChip{display:inline-flex;align-items:center;gap:4px;background:white;border:2px solid #ffd39b;border-radius:14px;padding:4px 8px;font-size:13px}.previewChip .foodSvg{width:30px;height:30px}.previewOrder{display:inline-flex;align-items:center;background:white;border:2px solid #d7c9ff;border-radius:14px;padding:3px 5px}.previewOrder .foodSvg{width:32px;height:32px}.previewActions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}.cancelBtn{background:#fff;border-color:#c9d8e8;box-shadow:0 5px 0 #9fb5c8}.infoBtn{background:#fff8cc;border-color:#ffe28a;box-shadow:0 5px 0 #e6c85a}.levelBtn small{display:block;font-size:11px;color:#9a7154;margin-top:2px}
@media (max-width: 760px){
  body{display:block;overflow:hidden;}
  #game{width:100vw;min-width:0;max-width:none;height:100dvh;box-shadow:none;}
  .topbar{height:58px;padding:6px;gap:4px}.brand{font-size:16px;gap:6px}.bunnyLogo{width:34px;height:34px}.bunnyLogo:before,.bunnyLogo:after{width:10px;height:22px;top:-18px}.hud{font-size:12px;gap:3px}.pill{padding:4px 5px;border-width:2px}.incomePill{font-size:15px;padding:4px 6px}.incomePill #score{font-size:20px}.soundBtn{width:38px;min-height:34px;font-size:18px}
  .main{grid-template-rows:35% 25% 40%;}
  #customerRow{left:1%;right:1%;gap:3px;justify-content:space-around;bottom:6px;}
  .customer{width:19%;min-width:0;max-width:none;}
  .animal{font-size:42px;}
  .custName{font-size:11px;padding:0 3px;}
  .patience{width:86%;height:8px;margin:2px auto;}
  .orderBubble{top:-54px;min-width:54px;min-height:40px;max-width:72px;padding:3px;border-width:2px;border-radius:12px;font-size:18px;gap:1px;box-shadow:0 4px 10px rgba(120,80,40,.14);}
  .orderBubble:after{bottom:-8px;border-width:8px 6px 0 6px;}
  .orderBubble .foodSvg{width:30px;height:30px;}
  .orderBubble.combo{min-width:58px;max-width:74px;gap:0;padding:2px;}
  .orderBubble.combo .foodSvg{width:25px;height:25px;}
  .truck{gap:6px;justify-content:center;align-items:center;}
  .bunnyChef{font-size:38px;width:48px;}
  .speech{font-size:11px;max-width:112px;padding:4px 6px;left:4px;top:4px;border-width:2px;border-radius:12px;}
  .plates{display:grid;grid-template-columns:repeat(3,54px);grid-auto-rows:54px;gap:6px;max-width:none;align-items:center;justify-content:center;margin-left:8px;}
  .plate{width:54px;height:54px;font-size:26px;border-radius:14px;border-width:2px;box-shadow:0 3px 0 #b8a8ee;}
  .plate.selected{outline:3px solid #ff8db3;transform:scale(1.04)}
  .plate .foodSvg{width:45px;height:45px;}
  .plate .small{font-size:11px;right:2px;bottom:1px;}
  .workshop{grid-template-columns:1fr;padding:7px;gap:7px;}
  .section{border-radius:16px;padding:6px;border-width:2px;}
  .sectionTitle{font-size:13px;margin-bottom:4px}.buttons{gap:6px}button{font-size:13px;min-height:36px;padding:5px 7px;border-radius:14px;border-width:2px}.machine{padding:5px;margin-bottom:5px}.machineName{font-size:13px;min-width:64px}.progress{height:13px}.takeBtn{min-height:30px;font-size:12px;min-width:54px}
  .toast{top:72px;left:50%;max-width:74vw;padding:7px 10px;font-size:16px;border-width:3px;border-radius:15px;line-height:1.25;box-shadow:0 5px 14px rgba(120,80,40,.18);}
  .moneyPop{font-size:24px;padding:4px 8px;}
  .modal{align-items:flex-start;justify-content:center;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px;}
  .card{width:96vw;max-width:96vw;max-height:calc(100dvh - 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;border-width:4px;border-radius:22px;}
  .card h1{font-size:24px}.card p{font-size:14px;line-height:1.45}.bigBtn{font-size:17px;min-height:42px;padding:9px 14px}.levelGrid{grid-template-columns:repeat(2,1fr);gap:7px}.recipe{font-size:12px;padding:8px;margin:8px auto}.previewGrid{grid-template-columns:1fr;gap:7px}.previewBox{padding:8px;border-width:2px;border-radius:14px;font-size:13px}.previewChip{font-size:12px;padding:3px 6px}.previewChip .foodSvg{width:24px;height:24px}.previewOrder .foodSvg{width:26px;height:26px}.statsWrap{grid-template-columns:1fr;max-height:42vh}.statCard{padding:6px;border-width:2px}.stars{font-size:32px;margin:8px;}
}

/* Strong mobile-only overrides: phones/tablets, without changing desktop layout */
@media (max-width: 900px), (hover: none) and (pointer: coarse){
  html, body{width:100%;height:100%;overflow:hidden;}
  body{display:block;}
  #game{width:100vw !important;min-width:0 !important;max-width:none !important;height:100svh;height:100dvh;box-shadow:none !important;border-radius:0;}
  .main{grid-template-rows:22% 30% 48%;}

  .sun{width:24px;height:24px;right:16px;top:8px;box-shadow:0 0 0 5px rgba(255,229,111,.20);}
  .cloud{width:46px;height:16px;left:18px;top:9px;opacity:.62;}
  .cloud:before{width:21px;height:21px;left:6px;top:-10px}.cloud:after{width:18px;height:18px;left:24px;top:-7px}

  /* 1) Preview / result modal must be scrollable on mobile */
  .modal{position:fixed;inset:0;align-items:flex-start !important;justify-content:center;overflow-y:auto !important;-webkit-overflow-scrolling:touch;padding:8px !important;overscroll-behavior:contain;}
  .card{width:96vw !important;max-width:96vw !important;max-height:none !important;min-height:auto;overflow:visible !important;margin:0 auto 16px auto;padding:12px !important;border-width:4px;border-radius:20px;}
  .card h1{font-size:22px;margin-bottom:6px;}
  .card p{font-size:13px;line-height:1.38;margin:6px 0;}
  .bigBtn{font-size:16px;min-height:42px;padding:8px 13px;margin:5px;}
  .levelGrid{grid-template-columns:repeat(2,1fr) !important;gap:7px;}
  .recipe,.previewBox{font-size:12px;padding:7px;margin:6px auto;border-radius:13px;}
  .previewGrid{grid-template-columns:1fr !important;gap:7px;}
  .previewChip{font-size:12px;padding:3px 6px;}
  .previewChip .foodSvg{width:22px;height:22px;}
  .previewOrder .foodSvg{width:24px;height:24px;}
  .statsWrap{grid-template-columns:1fr !important;max-height:none !important;overflow:visible !important;}

  /* 2) Plates: exactly 2 rows x 3 columns on mobile */
  .truck{gap:4px;align-items:center;justify-content:center;padding:2px 4px;}
  .bunnyChef{font-size:34px;width:42px;flex:0 0 42px;}
  .plates{display:grid !important;grid-template-columns:repeat(3,68px) !important;grid-template-rows:repeat(2,68px) !important;gap:7px !important;max-width:218px !important;width:218px !important;flex:0 0 218px;align-items:center;justify-content:center;margin:0 !important;}
  .plate{width:68px !important;height:68px !important;border-radius:16px;border-width:2px;box-shadow:0 3px 0 #b8a8ee;}
  .plate .foodSvg{width:56px;height:56px;}
  .plate .small{font-size:10px;right:1px;bottom:0;}
  .plate.selected{outline:3px solid #ff8db3;transform:scale(1.035);}

  /* 3) Customer order bubbles: smaller and spaced to avoid overlap */
  #customerRow{left:2px !important;right:2px !important;gap:4px !important;justify-content:space-evenly !important;bottom:5px;}
  .customer{width:24% !important;min-width:0 !important;max-width:none !important;}
  .animal{font-size:42px !important;}
  .custName{font-size:10px;padding:0 2px;}
  .patience{width:84%;height:7px;margin:1px auto 0;}
  .orderBubble{top:-56px !important;min-width:56px !important;min-height:42px !important;max-width:82px !important;padding:3px !important;border-width:2px;border-radius:12px;gap:1px !important;}
  .orderBubble:after{bottom:-7px;border-width:7px 5px 0 5px;}
  .orderBubble .foodSvg{width:30px !important;height:30px !important;}
  .orderBubble.combo{min-width:62px !important;max-width:88px !important;}
  .orderBubble.combo .foodSvg{width:24px !important;height:24px !important;}

  /* 4) Bigger workshop controls on mobile, with enough vertical room for 3 machines */
  .workshop{grid-template-columns:1fr !important;grid-template-rows:auto 1fr !important;padding:8px !important;gap:7px !important;overflow:hidden !important;min-height:0;}
  .section{padding:7px !important;border-radius:18px;min-height:0;}
  .sectionTitle{font-size:16px !important;margin-bottom:5px;}
  .buttons{gap:7px !important;}
  button{font-size:16px !important;min-height:42px !important;padding:7px 10px !important;border-radius:16px;}
  .btnIcon .foodSvg{width:30px;height:30px;}
  #machines{display:flex;flex-direction:column;gap:6px;}
  .machine{padding:6px !important;margin-bottom:0 !important;min-height:46px;}
  .machineName{font-size:16px !important;min-width:78px !important;}
  .progress{height:16px !important;}
  .takeBtn{font-size:15px !important;min-width:66px !important;min-height:34px !important;}

  /* 5) Toast/hint message: compact, top-right, not covering plates */
  .toast{left:auto !important;right:8px !important;top:66px !important;transform:none !important;max-width:48vw !important;padding:6px 8px !important;font-size:13px !important;line-height:1.25;border-width:2px;border-radius:13px;text-align:center;box-shadow:0 5px 12px rgba(120,80,40,.18);}
  @keyframes pop{0%{opacity:0;transform:scale(.85)}20%{opacity:1;transform:scale(1.02)}80%{opacity:1}100%{opacity:0;transform:translateY(-12px) scale(1)}}
}

/* mobile-v4-equipment-fit */
</style>
</head>
<body>
<div id="game">
  <div class="topbar">
    <div class="brand"><div class="bunnyLogo"></div>兔兔開心早午餐</div>
    <div class="hud">
      <div class="pill">第 <span id="levelNo">1</span> 關</div>
      <div class="pill">⏰ <span id="time">60</span></div>
      <div class="pill incomePill">💰 $<span id="score">0</span>/$<span id="target">100</span></div>
      <div class="pill">🍬 <span id="candies">0</span></div>
      <button id="soundToggle" class="soundBtn" title="音效開關">🔊</button>
    </div>

function svgWrap(inner, cls='foodSvg'){

}
function dishSvg(items=[], cls='foodSvg'){

  if(has('candy') && list.length===1) return svgWrap(`<path d="M16 44l18-12v36L16 56zM84 44L66 32v36l18-12z" fill="#ffd36e" stroke="#8b5a3c" stroke-width="4" stroke-linejoin="round"/><rect x="32" y="31" width="36" height="38" rx="13" fill="#ff8db3" stroke="#8b5a3c" stroke-width="4"/><path d="M42 35c7 7 9 23 0 30M57 35c7 7 9 23 0 30" stroke="#fff7d6" stroke-width="5" stroke-linecap="round"/>`, cls);

  let out=`<ellipse cx="50" cy="78" rx="40" ry="13" fill="#efe7ff" stroke="#b9a9ee" stroke-width="5"/><ellipse cx="50" cy="76" rx="27" ry="7" fill="#ffffff" opacity=".85"/>`;
  if(has('pancake')){
    out+=`<ellipse cx="50" cy="63" rx="30" ry="10" fill="#d9953f" stroke="#8b5a3c" stroke-width="3"/><ellipse cx="50" cy="56" rx="29" ry="10" fill="#f0b866" stroke="#8b5a3c" stroke-width="3"/><ellipse cx="50" cy="49" rx="27" ry="10" fill="#ffd080" stroke="#8b5a3c" stroke-width="3"/><rect x="43" y="38" width="16" height="10" rx="2" fill="#fff1a6" stroke="#c19131" stroke-width="2"/>`;

  if(has('toast')){

      out+=`<path d="M31 42h38v27H31z" fill="#ffd94d" stroke="#c28a1a" stroke-width="3"/><path d="M31 64c7-5 10 4 16 0s10-5 22 1v4H31z" fill="#ffc83d"/><circle cx="42" cy="53" r="4" fill="#fff09a"/><circle cx="58" cy="59" r="3" fill="#fff09a"/>`;
    } else if(has('egg')){

    } else {

const Sound={
  ctx:null,
  enabled:true,
  unlocked:false,
  // 音量集中管理：master 是總音量，其餘是各事件相對音量。
  // 想整體調小：改 master。想調單一音效：改 volumes 裡的數值。
  master:0.26,
  volumes:{
    button:0.16,
    start:0.16,
    ready:0.34,   // 機器完成：相對大聲一點
    take:0.15,
    place:0.13,
    dish:0.20,
    serve:0.24,
    bonus:0.36,   // 保留給過關獎勵
    cash:0.68,    // 完成客人訂單：清脆收銀機「叮」，最重要所以最大聲
    wrong:0.13,
    leave:0.10,
    trash:0.11,
    candy:0.16,
    end:0.20
  },
  init(){
    if(!this.enabled) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    if(!this.ctx) this.ctx=new AC();
    if(this.ctx.state==='suspended') this.ctx.resume();
    this.unlocked=true;
  },
  toggle(){
    this.enabled=!this.enabled;
    if(this.enabled) this.init();
    const b=document.getElementById('soundToggle');
    if(b) b.textContent=this.enabled?'🔊':'🔇';
    if(this.enabled) this.play('button');
  },
  getVolume(name, scale=1){
    return (this.volumes[name] ?? 0.16) * this.master * scale;
  },
  tone(name, freq=440, dur=.12, type='sine', scale=1, delay=0){
    if(!this.enabled) return;
    this.init();
    const ctx=this.ctx; if(!ctx) return;
    const t=ctx.currentTime+delay;
    const osc=ctx.createOscillator();
    const g=ctx.createGain();
    osc.type=type;
    osc.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001,this.getVolume(name,scale)),t+.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t+dur+.03);
  },
  noise(name, dur=.08, scale=1, delay=0){
    if(!this.enabled) return;
    this.init();
    const ctx=this.ctx; if(!ctx) return;
    const t=ctx.currentTime+delay;
    const buffer=ctx.createBuffer(1,Math.max(1,ctx.sampleRate*dur),ctx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*(1-i/data.length);
    const src=ctx.createBufferSource(); src.buffer=buffer;
    const g=ctx.createGain();
    g.gain.setValueAtTime(this.getVolume(name,scale),t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(g); g.connect(ctx.destination); src.start(t);
  },
  chord(name, notes, type='sine'){
    notes.forEach(n=>this.tone(name,n.freq,n.dur,type,n.scale ?? 1,n.delay ?? 0));
  },
  play(name){
    if(!this.enabled) return;
    const s={
      button:()=>this.tone('button',520,.055,'sine'),
      start:()=>this.chord('start',[{freq:260,dur:.055,scale:.9},{freq:390,dur:.07,scale:.75,delay:.055}],'square'),
      ready:()=>this.chord('ready',[{freq:880,dur:.12,scale:1.05},{freq:1175,dur:.15,scale:.95,delay:.10},{freq:1568,dur:.13,scale:.65,delay:.20}],'sine'),
      take:()=>{this.tone('take',420,.06,'triangle'); this.noise('take',.035,.55,.02);},
      place:()=>this.chord('place',[{freq:330,dur:.07,scale:.9},{freq:500,dur:.06,scale:.7,delay:.05}],'triangle'),
      dish:()=>this.chord('dish',[{freq:660,dur:.08},{freq:880,dur:.09,delay:.075},{freq:1320,dur:.12,scale:.75,delay:.16}],'sine'),
      serve:()=>this.chord('serve',[{freq:660,dur:.08},{freq:990,dur:.10,scale:.95,delay:.08}],'triangle'),
      bonus:()=>this.chord('bonus',[{freq:784,dur:.08,scale:1.05},{freq:988,dur:.08,scale:1.05,delay:.08},{freq:1319,dur:.14,scale:1.0,delay:.16},{freq:1760,dur:.12,scale:.7,delay:.26}],'sine'),
      cash:()=>{this.noise('cash',.025,.40,0); this.tone('cash',1175,.045,'square',.28,0); this.tone('cash',1760,.20,'sine',1.35,.025); this.tone('cash',2637,.18,'triangle',.85,.045); this.tone('cash',3520,.10,'sine',.45,.12);},
      wrong:()=>this.chord('wrong',[{freq:230,dur:.10},{freq:180,dur:.13,scale:.75,delay:.10}],'sine'),
      leave:()=>this.tone('leave',300,.18,'triangle'),
      trash:()=>{this.tone('trash',150,.08,'square'); this.noise('trash',.08,.9,.02);},
      candy:()=>this.chord('candy',[{freq:900,dur:.07},{freq:1200,dur:.12,scale:.9,delay:.08}],'sine'),
      end:()=>[523,659,784,1047].forEach((f,i)=>this.tone('end',f,.16,'triangle',1,i*.11))
    };
    (s[name]||s.button)();
  }
}
window.addEventListener('pointerdown',()=>Sound.init(),{once:true,passive:true});

let state, timer, spawnTimer, loop, machines, lastVisualUpdate=0;
function createStatsForLevel(levelIndex){
  const stats={};
  (LEVELS[levelIndex]?.recipes||[]).forEach(k=>stats[k]={sold:0, failed:0, burned:0});
  return stats;
}
function ensureStat(recipeKey){
  if(!state || !recipeKey) return null;
  if(!state.stats) state.stats={};
  if(!state.stats[recipeKey]) state.stats[recipeKey]={sold:0, failed:0, burned:0};
  return state.stats[recipeKey];
}
function addStat(recipeKey, field, amount=1){
  const st=ensureStat(recipeKey);
  if(st && field in st) st[field]+=amount;
}
function recordOrderStats(order, field){
  getOrderItems(order).forEach(k=>addStat(k, field, 1));
}
function recordBurn(machine){
  if(machine && machine.burnRecipe) addStat(machine.burnRecipe, 'burned', 1);
}
function canBurnRecipe(recipeKey){
  // 只有需要機器烹調的餐點才顯示燒焦數；飲料如牛奶、咖啡不顯示。
  return ['toast','cheese_toast','egg_toast','pancake'].includes(recipeKey);
}
function statsTableHtml(){
  const lv=LEVELS[state.level];
  const keys=lv.recipes.slice();
  return `<div class="statsWrap">${keys.map(k=>{
    const st=state.stats?.[k]||{sold:0,failed:0,burned:0};
    const burnHtml=canBurnRecipe(k)?`<span class="burnNum">燒焦 ${st.burned}</span>`:'';
    return `<div class="statCard"><div class="statIcon">${dishSvg(RECIPES[k].need)}</div><div class="statName">${RECIPES[k].name}</div><div class="statNums"><span class="soldNum">成功 ${st.sold}</span><span class="failNum">失敗 ${st.failed}</span>${burnHtml}</div></div>`;
  }).join('')}</div>`;
}

function initState(level=0){
 state={level, time:LEVELS[level].time, score:0, selected:null, holding:null, plates:Array(6).fill(null), customers:[], nextId:1, running:true, combo:0, candyMode:false, candies:LEVELS[level].candies||0, levelStars:Array(10).fill(0), stats:createStatsForLevel(level)};
 machines={toast:{name:'烤吐司機',action:'烤吐司',input:'bread',out:'toast',burnRecipe:'toast',dur:2600,burn:5200,status:'idle',start:0}, egg:{name:'平底鍋',action:'煎蛋',input:'raw_egg',out:'egg',burnRecipe:'egg_toast',dur:3000,burn:6000,status:'idle',start:0}, pancake:{name:'鬆餅機',action:'做鬆餅',input:'batter',out:'pancake',burnRecipe:'pancake',dur:3200,burn:6500,status:'idle',start:0}};
 document.getElementById('levelNo').textContent=level+1; document.getElementById('target').textContent=LEVELS[level].target; document.getElementById('candies').textContent=state.candies;
 setSpeech(LEVELS[level].intro); renderAll();

 timer=setInterval(()=>{ if(!state.running)return; state.time--; if(state.time<=0)endLevel(); renderHUD(); },1000);
 spawnTimer=setInterval(()=>{ if(state.running) maybeSpawn(); },1600);

 for(let i=0;i<Math.min(2,effectiveMaxCust(level));i++) setTimeout(maybeSpawn, 500+i*900);
}

 if(lv.recipes.includes('cheese_toast')) add(btnLabel('cheese','起司'),()=>addPlate('cheese'));
 if(lv.recipes.includes('coffee')) add(btnLabel('coffee','咖啡'),()=>addPlate('coffee'));

 if(state.candies>0) add(btnLabel('candy','糖果安撫'),()=>{state.candyMode=true; state.selected=null; state.holding=null; renderPlates(); toastMsg('請點一位客人');});
 add('🗑️ 丟掉選取盤',()=>discardSelected());

function renderMachines(){
 const box=document.getElementById('machines'); box.innerHTML='';
 Object.entries(machines).forEach(([key,m])=>{
   if(key==='egg'&&!LEVELS[state.level].recipes.includes('egg_toast'))return;
   if(key==='pancake'&&!LEVELS[state.level].recipes.includes('pancake'))return;
   let div=document.createElement('div'); div.className='machine '+m.status;
   let pct=0; if(m.status!=='idle') pct=Math.min(100,((Date.now()-m.start)/m.dur)*100);
   div.innerHTML=`<div class="machineName">${m.name}</div><div class="progress"><span style="width:${pct}%"></span></div>`;
   let btn=document.createElement('button'); btn.className='takeBtn '+m.status;
   if(m.status==='idle'){
     btn.textContent=m.action;
     btn.onpointerdown=(e)=>{e.preventDefault(); Sound.play('button'); startMachine(key)};
   } else if(m.status==='cook'){
     btn.textContent='製作中'; btn.disabled=true;
   } else if(m.status==='ready'){
     btn.textContent='拿取'; btn.onpointerdown=(e)=>{e.preventDefault(); Sound.play('button'); takeMachine(key)};

     btn.textContent='丟掉'; btn.onpointerdown=(e)=>{e.preventDefault(); Sound.play('trash'); m.status='idle';m.burnCounted=false;toastMsg('沒關係～再試一次');renderMachines();}

function clickPlate(i){
 const p=state.plates[i];
 state.candyMode=false;
 if(state.holding){
   placeHeldOnPlate(i);
   return;
 }
 if(!p){ state.selected=null; toastMsg('這是空盤子'); renderPlates(); return; }
 const complete=Object.keys(RECIPES).some(k=>matchRecipe(p,k));
 if(complete){
   state.selected=(state.selected===i?null:i);
   renderPlates();
   return;
 }
 // 未完成的單一食材盤可拿起來，再點另一個盤子組合。
 state.holding={items:p.slice(), source:i};
 state.plates[i]=null;
 state.selected=null;
 toastMsg('拿起 '+p.map(x=>ITEMS[x]?.[0]||x).join('+'));
 renderPlates();
}

function plateCount(){return state.plates.filter(Boolean).length;}
function placeNewPlate(items){
 const idx=firstEmptyPlate();
 if(idx<0){toastMsg('盤子滿了！');return false;}
 state.plates[idx]=items.slice();
 state.selected=idx;
 return true;
}
function placeHeldOnPlate(i){
 const held=state.holding;
 if(!held)return;
 const current=state.plates[i];
 if(!current){
   state.plates[i]=held.items.slice();
   state.selected=i;
   state.holding=null;
   Sound.play('place');
   toastMsg(recipeNameForPlate(state.plates[i]));
   renderPlates();
   return;
 }
 const next=current.concat(held.items);
 if(isRecipePrefix(next)){
   state.plates[i]=next;
   state.selected=i;
   state.holding=null;
   Sound.play(matchRecipe(next,'cheese_toast')||matchRecipe(next,'egg_toast')?'dish':'place');
   toastMsg(recipeNameForPlate(next));
   renderPlates();
   return;
 }
 // 無法組合時，不要把牛奶、咖啡等套餐單品硬塞到吐司上。
 // 例如「吐司＋牛奶」是套餐，應該是兩個盤子：一盤吐司、一盤牛奶。
 // 如果玩家拿著新食材點到不相容的盤子，就自動放到空盤，避免誤以為失敗或把食材吃掉。
 if(held.source==null){
   const empty=firstEmptyPlate();
   if(empty>=0){
     state.plates[empty]=held.items.slice();
     state.selected=empty;
     state.holding=null;
     Sound.play('place');
     toastMsg('套餐要分盤，已放到空盤');
     renderPlates();
     return;
   }
   Sound.play('wrong');
   toastMsg('這個要放另一個空盤喔');
   renderPlates();
   return;
 }
 // 從盤子拿起的食材若無法組合，放回原盤，避免誤丟。
 if(held.source!=null && !state.plates[held.source]) state.plates[held.source]=held.items.slice();
 state.holding=null;
 Sound.play('wrong');
 toastMsg('這樣不能組合喔');
 renderPlates();
}
function renderCustomers(){
 const row=document.getElementById('customerRow'); row.innerHTML='';
 state.customers.forEach(c=>{
   const orderItems=getOrderItems(c.order);
   let div=document.createElement('div');
   div.className='customer';
   let w=Math.max(0,Math.floor(c.pat/c.maxPat*100));
   let orderHtml=orderItems.map(k=>dishSvg(RECIPES[k].need)).join('');
   let comboClass=orderItems.length>1?' combo':'';
   const patienceClass = w > 50 ? 'green' : (w >= 20 ? 'yellow' : 'red');
   div.innerHTML=`<div class="orderBubble${comboClass}">${orderHtml}</div><div class="animal">${c.icon}</div><div class="patience ${patienceClass}"><span style="width:${w}%"></span></div><div class="custName">${c.name}</div>`;
   div.onpointerdown=(e)=>{e.preventDefault(); Sound.play('button'); clickCustomer(c.id);};
   row.appendChild(div);
 });
}

function getOrderItems(order){return Array.isArray(order)?order:[order];}
function orderLabel(order){return getOrderItems(order).map(k=>RECIPES[k].name).join('＋');}
function baseOrderPrice(order){return getOrderItems(order).reduce((sum,k)=>sum+(RECIPES[k]?.price||0),0);}
function comboBonusRate(order){let n=getOrderItems(order).length; return n>=3?0.20:n===2?0.10:0;}
function orderValue(order, patienceRatio=1){
  const base=baseOrderPrice(order);
  const combo=Math.round(base*comboBonusRate(order));
  const tip=patienceRatio>.65?Math.round((base+combo)*0.20):patienceRatio>.35?Math.round((base+combo)*0.10):0;
  return {base, combo, tip, total:base+combo+tip};
}
function possibleOrdersForLevel(){
  const lv=LEVELS[state.level];
  const singles=lv.recipes.map(x=>[x]);
  const combos=COMBO_ORDERS.filter(o=>state.level+1>=o.level && o.items.every(x=>lv.recipes.includes(x))).map(o=>o.items);
  return singles.concat(combos);
}
function findPlateForRecipe(recipeKey, used=new Set()){
  for(let i=0;i<state.plates.length;i++){
    if(used.has(i) || !state.plates[i]) continue;
    if(matchRecipe(state.plates[i], recipeKey)) return i;
  }
  return -1;
}
function findPlatesForOrder(order){
  const used=new Set(), indices=[];
  for(const item of getOrderItems(order)){
    const idx=findPlateForRecipe(item, used);
    if(idx<0) return null;
    used.add(idx); indices.push(idx);
  }
  return indices;
}
function normList(list){return list.slice().sort().join(',');}
function isRecipePrefix(list){
  const got=list.slice().sort();
  return Object.values(RECIPES).some(r=>{
    const need=r.need.slice().sort();
    return got.every(x=>need.includes(x)) && got.length<=need.length;
  });
}
function recipeNameForPlate(plate){
  let key=Object.keys(RECIPES).find(k=>matchRecipe(plate,k));
  return key?RECIPES[key].name:'料理中';
}
function addPlate(item){
  Sound.play('place');
  // 新邏輯：先拿起食材，再點指定盤子。
  state.holding={items:[item], source:null};
  state.selected=null;
  toastMsg('請點一個盤子');
  renderPlates();
}
function discardSelected(){
  if(state.holding){
    if(state.holding.source!=null && !state.plates[state.holding.source]) state.plates[state.holding.source]=state.holding.items.slice();
    state.holding=null;
    Sound.play('place');
    toastMsg('放回來了');
    renderPlates();
    return;
  }
  if(state.selected==null || !state.plates[state.selected]){toastMsg('先點要丟掉的盤子');return;}
  state.plates[state.selected]=null;
  state.selected=null;
  Sound.play('trash');
  toastMsg('盤子清空了');
  renderPlates();
}
function startMachine(key){let m=machines[key]; if(m.status!=='idle'){toastMsg('設備正在忙喔');Sound.play('wrong');return;} Sound.play('start'); m.status='cook';m.start=Date.now();m.readySound=false;m.burnCounted=false;renderMachines();}
function takeMachine(key){
  let m=machines[key];
  // 烤好的東西會放到新的空盤，不會自動疊到同一盤。
  if(!placeNewPlate([m.out])){return;}
  m.status='idle';
  m.burnCounted=false;
  state.holding=null;
  Sound.play('take');
  toastMsg('放到新盤子了！');
  renderMachines(); renderPlates();
}
function update(){
 if(!state.running)return;
 let now=Date.now();
 Object.values(machines).forEach(m=>{
   if(m.status==='cook'&&now-m.start>=m.dur){
     m.status='ready';
     if(!m.readySound){m.readySound=true; Sound.play('ready');}
   }
   if(m.status==='ready'&&now-m.start>=m.burn){
     m.status='burn';
     if(!m.burnCounted){m.burnCounted=true; recordBurn(m);}
   }
 });
 state.customers.forEach(c=>c.pat-=0.12);
 const leaving=state.customers.filter(c=>c.pat<=0);
 if(leaving.length){
   leaving.forEach(c=>recordOrderStats(c.order,'failed'));
   state.combo=0;Sound.play('leave');toastMsg('下次再來～');
 }
 state.customers=state.customers.filter(c=>c.pat>0);
 let now2=Date.now(); if(now2-lastVisualUpdate>250){lastVisualUpdate=now2; renderMachines(); renderCustomers();}
}
function maybeSpawn(){let lv=LEVELS[state.level]; if(state.customers.length>=effectiveMaxCust(state.level))return; if(Math.random()<0.62 || state.customers.length===0){
 let ck=lv.customers[Math.floor(Math.random()*lv.customers.length)], base=CUST[ck];
 let possible=possibleOrdersForLevel();
 if(base.pref.length&&Math.random()<0.55){
   const preferred=possible.filter(order=>getOrderItems(order).some(x=>base.pref.includes(x)));
   if(preferred.length) possible=preferred;
 }
 let order=possible[Math.floor(Math.random()*possible.length)];
 state.customers.push({id:state.nextId++,icon:base.icon,name:base.name,order,pat:base.pat,maxPat:base.pat}); renderCustomers(); }}
function matchRecipe(plate, recipeKey){let need=RECIPES[recipeKey].need.slice().sort().join(','); let got=plate.slice().sort().join(','); return need===got;}
function clickCustomer(id){let c=state.customers.find(x=>x.id===id); if(!c)return;
 if(state.candyMode){ if(state.candies>0){c.pat=Math.min(c.maxPat,c.pat+9);state.candies--;state.candyMode=false;Sound.play('candy');toastMsg('客人變開心了！');renderHUD();renderIngredients();renderCustomers();} return;}
 const matched=findPlatesForOrder(c.order);
 if(matched){
   const ratio=c.pat/c.maxPat;
   const value=orderValue(c.order, ratio);
   matched.forEach(i=>state.plates[i]=null);
   recordOrderStats(c.order,'sold');
   state.customers=state.customers.filter(x=>x.id!==id);
   state.selected=null; state.combo++;
   state.score+=value.total;
   Sound.play('cash');
   moneyMsg(value.total);
   const comboText=getOrderItems(c.order).length>1?`套餐加成 $${value.combo}，`:'';
   const tipText=value.tip?`小費 $${value.tip}！`:'';
   toastMsg(`${comboText}${tipText || '謝謝你！'}`);
   renderAll();
   return;
 }
 Sound.play('wrong');
 state.combo=0; c.pat-=2;
 const need=orderLabel(c.order);
 toastMsg(`還缺：${need}`);
 renderCustomers();
}
function endLevel(){
 if(!state.running) return;
 // 時間到時仍在等待的客人不算失敗；只有耐心歸零離開的客人才會在 update() 中記錄失敗。
 state.customers=[];
 state.running=false;clearInterval(timer);clearInterval(spawnTimer);clearInterval(loop);
 let lv=LEVELS[state.level];
 let stars=state.score>=Math.round(lv.target*1.35)?3:state.score>=Math.round(lv.target*1.15)?2:state.score>=lv.target?1:0;
 showEnd(stars);
}
function showEnd(stars){
 Sound.play(stars?'end':'leave');
 let div=document.createElement('div');div.className='modal';
 let lv=LEVELS[state.level];
 let passed=state.score>=lv.target;
 let msg=stars?`今日收入 $${state.score}，目標 $${lv.target}，經營得很棒！`:`今日收入 $${state.score}，目標 $${lv.target}，再試一次一定更棒！`;
 const nextDisabled=(state.level<9 && !passed);
 const nextText=state.level<9?'下一關':'回選單';
 div.innerHTML=`<div class="card"><h1>${stars?'太棒了！':'辛苦了！'}</h1><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p>${msg}</p>${statsTableHtml()}<button class="bigBtn" id="retry">再玩一次</button><button class="bigBtn ${nextDisabled?'disabled':''}" id="next">${nextText}</button></div>`;
 document.getElementById('game').appendChild(div);
 document.getElementById('retry').onpointerdown=(e)=>{e.preventDefault();Sound.play('button');div.remove();initState(state.level)};
 const nextBtn=document.getElementById('next');
 if(!nextDisabled){nextBtn.onpointerdown=(e)=>{e.preventDefault();Sound.play('button');div.remove(); if(state.level<9)initState(state.level+1); else showStart();};}
}
function levelOrderSamples(levelIndex){
  const lv=LEVELS[levelIndex];
  const singles=lv.recipes.map(x=>[x]);
  const combos=COMBO_ORDERS.filter(o=>levelIndex+1>=o.level && o.items.every(x=>lv.recipes.includes(x))).map(o=>o.items);
  return singles.concat(combos);
}
function orderPreviewHtml(order){
  return `<span class="previewOrder" title="${orderLabel(order)}">${getOrderItems(order).map(k=>dishSvg(RECIPES[k].need)).join('')}</span>`;
}
function customerPreviewHtml(levelIndex){
  return LEVELS[levelIndex].customers.map(k=>`<span class="previewChip">${CUST[k].icon} ${CUST[k].name}</span>`).join('');
}
function levelPreviewHtml(levelIndex){
  const lv=LEVELS[levelIndex];
  const orders=levelOrderSamples(levelIndex);
  const combos=orders.filter(o=>getOrderItems(o).length>1);
  const machines=[];
  if(lv.recipes.includes('toast')) machines.push('烤吐司機');
  if(lv.recipes.includes('egg_toast')) machines.push('平底鍋');
  if(lv.recipes.includes('pancake')) machines.push('鬆餅機');
  return `<h1>第 ${levelIndex+1} 關內容</h1>
    <p>${lv.intro}</p>
    <div class="previewGrid">
      <div class="previewBox"><b>基本資料</b><br>⏰ 時長：${lv.time} 秒<br>💰 目標收入：$${lv.target}<br>👥 同時客人上限：${effectiveMaxCust(levelIndex)}${isMobileGameLayout()&&lv.maxCust>4?'（手機版）':''}<br>🍬 糖果：${lv.candies||0} 顆</div>
      <div class="previewBox"><b>設備</b><br>${machines.join('、') || '無'}<br><br><b>客人</b><div class="previewList">${customerPreviewHtml(levelIndex)}</div></div>
    </div>
    <div class="previewBox"><b>可能出現的餐點／套餐</b><div class="previewList">${orders.map(orderPreviewHtml).join('')}</div></div>
    ${combos.length?`<div class="previewBox"><b>套餐提醒</b><div class="previewList">${combos.map(o=>`<span class="previewChip">${orderLabel(o)}（$${orderValue(o,1).base}+套餐加成）</span>`).join('')}</div></div>`:''}
    <div class="previewActions"><button class="bigBtn" id="confirmStart">開始</button><button class="bigBtn cancelBtn" id="cancelPreview">取消</button></div>`;
}
function showLevelPreview(levelIndex, menuDiv){
  Sound.play('button');
  let div=document.createElement('div');
  div.className='modal';
  div.innerHTML=`<div class="card">${levelPreviewHtml(levelIndex)}</div>`;
  document.getElementById('game').appendChild(div);
  document.getElementById('confirmStart').onpointerdown=(e)=>{e.preventDefault();Sound.play('button');div.remove();menuDiv.remove();initState(levelIndex);};
  document.getElementById('cancelPreview').onpointerdown=(e)=>{e.preventDefault();Sound.play('button');div.remove();};
}
function showStart(){
 clearInterval(timer);clearInterval(spawnTimer);clearInterval(loop);
 let div=document.createElement('div');div.className='modal';
 div.innerHTML=`<div class="card"><h1>🐰 兔兔開心早午餐</h1><p>幫兔兔做早餐，賺取今日收入！<br>點選關卡後會先看到關卡資訊，按「開始」才正式進入遊戲。</p><div class="recipe"><b>小提醒：</b><br>套餐不要疊在同一盤，例如吐司＋牛奶，要做成一盤吐司和一盤牛奶，再點客人送出。<br>越複雜的餐點收入越高；套餐會有額外加成。</div><div class="levelGrid">${LEVELS.map((lv,i)=>`<button class="levelBtn" data-lv="${i}">第 ${i+1} 關<small>${lv.time} 秒／$${lv.target}</small></button>`).join('')}</div><p class="hint">適合滑鼠、手機與平板觸控。完成訂單時會有清脆的收銀機聲。</p></div>`;
 document.getElementById('game').appendChild(div);
 div.querySelectorAll('.levelBtn').forEach(b=>b.onpointerdown=(e)=>{e.preventDefault();let lv=+b.dataset.lv;showLevelPreview(lv,div);});
}
showStart();
</script>
