<body>
<div class="app" id="app">

      const map={tap:[520,.05],match:[720,.09],special:[930,.16],win:[660,.42],build:[820,.25],fail:[220,.3]};
      const [freq,dur]=map[kind]||map.tap;
      o.frequency.setValueAtTime(freq,audioCtx.currentTime);
      if(kind==='win') o.frequency.exponentialRampToValueAtTime(1100,audioCtx.currentTime+dur);

  function levelConfig(level){
    const a=PIECES[(level-1)%6].id,b=PIECES[(level+1)%6].id;
    const base=7+Math.floor(level*.7);
    const goals={[a]:base,[b]:Math.max(5,base-3)};
    const obstacles=[];
    if(level>=7) obstacles.push({type:'ice',count:Math.min(4+Math.floor(level/5),10)});
    if(level>=13) obstacles.push({type:'mud',count:Math.min(4+Math.floor(level/6),9)});
    if(level>=20) obstacles.push({type:'crate',count:Math.min(2+Math.floor((level-18)/4),6)});
    return {level,moves:Math.max(19,28-Math.floor(level/4)),goals,obstacles};
  }

  function levelBonusInfo(level){
    const cfg=levelConfig(level),types=cfg.obstacles.filter(o=>o.type==='ice'||o.type==='mud').map(o=>o.type);
    const hasIce=types.includes('ice'),hasMud=types.includes('mud');
    if(!hasIce&&!hasMud)return null;
    if(hasIce&&hasMud)return {kind:'sparkle',name:'閃亮寶箱',emoji:'✨🎁',condition:'清除全部冰塊與泥巴'};
    if(hasIce)return {kind:'ice',name:'冰晶寶箱',emoji:'🧊🎁',condition:'打破全部冰塊'};
    return {kind:'mud',name:'清潔寶箱',emoji:'🧹🎁',condition:'清除全部泥巴'};
  }
  function bonusRewardText(reward){return reward==='hammer'?'小槌子＋1':reward==='shuffle'?'魔法洗牌＋1':'隨機道具';}

  function startLevel(level){

    else if(level===13)setTimeout(()=>toast('清除全部冰塊與泥巴，可獲得額外寶箱！'),450);
  }

  function createBoard(cfg){
    let board=[];
    for(let i=0;i<49;i++){
      let type,tries=0;
      do{type=randPiece();tries++;}while(tries<20&&wouldMatchOnCreate(board,i,type));
      board.push({type,special:null,obstacle:null,hp:0});
    }
    const slots=[...Array(49).keys()].sort(()=>Math.random()-.5);
    cfg.obstacles.forEach(o=>{
      for(let n=0;n<o.count;n++){
        let idx=slots.pop();if(idx===undefined)return;
        if(o.type==='crate'){board[idx]={type:null,special:null,obstacle:'crate',hp:1};}
        else board[idx].obstacle=o.type;
      }
    });
    let safety=0;while(findMatches(board).groups.length&&safety++<20){findMatches(board).matched.forEach(i=>{if(board[i].type)board[i].type=randPiece();});}
    if(!findPossibleMove(board)) return createBoard(cfg);
    return board;
  }
  function randPiece(){return PIECES[Math.floor(Math.random()*PIECES.length)].id;}
  function wouldMatchOnCreate(board,i,type){const r=Math.floor(i/7),c=i%7;return (c>=2&&board[i-1]?.type===type&&board[i-2]?.type===type)||(r>=2&&board[i-7]?.type===type&&board[i-14]?.type===type);}

  function renderGame(){
    renderGoals();const board=$('#board');board.innerHTML='';
    game.board.forEach((cell,i)=>{
      const b=document.createElement('button');b.className='cell'+(selectedCell===i?' selected':'')+(cell.obstacle==='crate'?' blocked':'');b.dataset.i=i;b.setAttribute('role','gridcell');b.setAttribute('aria-label',cellLabel(cell,i));
      if(cell.type){
        const fromAttr=Number.isInteger(cell._fromIndex)?` data-from-index="${cell._fromIndex}"`:'';
        b.innerHTML=`<span class="piece-wrap"${fromAttr}><span class="gem">${pieceById[cell.type].emoji}</span>${specialMark(cell.special)}${cell.obstacle&&cell.obstacle!=='crate'?`<span class="obstacle ${cell.obstacle}"></span>`:''}</span>`;
      }else if(cell.obstacle==='crate'){
        b.innerHTML='<span class="obstacle crate"></span>';
      }
      b.addEventListener('pointerdown',onPointerDown);b.addEventListener('pointerup',onPointerUp);board.appendChild(b);
    });
  }
  function cellLabel(cell,i){if(cell.obstacle==='crate')return `第 ${i+1} 格木箱`;const obstacle=cell.obstacle==='ice'?'，覆蓋冰塊':cell.obstacle==='mud'?'，覆蓋泥巴':'';return `${pieceById[cell.type]?.name||'空格'}${cell.special?'特殊方塊':''}${obstacle}`;}
  function specialMark(s){return s?`<span class="special-mark">${s==='row'?'↔️':s==='col'?'↕️':s==='bomb'?'💥':'🌈'}</span>`:'';}
  function remainingBonus(type){return game?.board?.filter(c=>c.obstacle===type).length||0;}
  function hasBonusChallenge(){return !!game&&Object.keys(game.bonusInitial||{}).length>0;}
  function bonusChallengeComplete(){return hasBonusChallenge()&&Object.keys(game.bonusInitial).every(type=>remainingBonus(type)===0);}
  function renderGoals(){
    const panel=$('#goalPanel');panel.innerHTML='';
    Object.entries(game.cfg.goals).forEach(([type,target])=>{const n=Math.min(game.collected[type]||0,target);const d=document.createElement('div');d.className='goal-item'+(n>=target?' complete':'');d.innerHTML=`<span class="gemoji">${pieceById[type].emoji}</span><span>${n}/${target}</span>`;panel.appendChild(d);});
    const m=document.createElement('div');m.className='moves-bubble';m.innerHTML=`<strong>${game.moves}</strong><small>剩餘步數</small>`;panel.appendChild(m);
    if(hasBonusChallenge()){
      const claimed=state.bonusClaims[String(game.cfg.level)],complete=bonusChallengeComplete(),d=document.createElement('div');d.className='bonus-goal'+(complete?' complete':'')+(claimed?' claimed':'');
      const parts=Object.entries(game.bonusInitial).map(([type,target])=>{const cleared=target-remainingBonus(type);return `<span class="bonus-progress">${type==='ice'?'🧊':'🟤'} ${cleared}/${target}</span>`;}).join('');
      const status=claimed?`<span class="claimed-label">✅ 已領取：${bonusRewardText(claimed.reward)}</span>`:complete?'<span>完成！</span>':'';
      d.innerHTML=`<span>${claimed?'✅':'🎁'}</span><span class="bonus-title">額外寶箱</span>${parts}${status}`;panel.appendChild(d);
    }
  }

  function onPointerDown(e){
    if(inputLocked)return;const i=Number(e.currentTarget.dataset.i);pointerStart={i,x:e.clientX,y:e.clientY};e.currentTarget.setPointerCapture?.(e.pointerId);
  }
  function onPointerUp(e){
    if(inputLocked||!pointerStart)return;const start=pointerStart;pointerStart=null;const dx=e.clientX-start.x,dy=e.clientY-start.y;
    if(hammerMode){useHammer(start.i);return;}
    if(Math.max(Math.abs(dx),Math.abs(dy))>20){let target=start.i;if(Math.abs(dx)>Math.abs(dy))target+=dx>0?1:-1;else target+=dy>0?7:-7;if(isAdjacent(start.i,target))trySwap(start.i,target);return;}
    handleTap(start.i);
  }
  function handleTap(i){
    if(game.board[i].obstacle==='crate'){toast('木箱不能移動，要在旁邊消除');return;}
    if(selectedCell===null){selectedCell=i;sound();renderGame();return;}
    if(selectedCell===i){selectedCell=null;renderGame();return;}
    if(isAdjacent(selectedCell,i)){const a=selectedCell;selectedCell=null;trySwap(a,i);}else{selectedCell=i;renderGame();}
  }
  function isAdjacent(a,b){if(b<0||b>=49)return false;const ar=Math.floor(a/7),br=Math.floor(b/7),ac=a%7,bc=b%7;return Math.abs(ar-br)+Math.abs(ac-bc)===1;}

  async function trySwap(a,b){
    if(inputLocked||!isAdjacent(a,b))return;
    const A=game.board[a],B=game.board[b];if(!A.type||!B.type||A.obstacle==='crate'||B.obstacle==='crate')return;
    inputLocked=true;swap(game.board,a,b);sound();renderGame();await wait(130);
    if(A.special==='rainbow'||B.special==='rainbow'){
      const rainbowIndex=A.special==='rainbow'?b:a;const otherIndex=rainbowIndex===a?b:a;await activateRainbow(rainbowIndex,game.board[otherIndex]?.type);game.moves--;await settleBoard();finishMove();return;
    }
    const matches=findMatches(game.board);
    if(!matches.groups.length){swap(game.board,a,b);renderGame();await wait(150);inputLocked=false;return;}
    game.moves--;await resolveMatches([b,a]);await settleBoard();finishMove();
  }
  function swap(board,a,b){[board[a],board[b]]=[board[b],board[a]];}

  function findMatches(board){
    const groups=[];const hMembership=new Map(),vMembership=new Map();
    for(let r=0;r<7;r++){
      let c=0;while(c<7){const idx=r*7+c,type=board[idx]?.special==='rainbow'?null:board[idx]?.type;if(!type){c++;continue;}let end=c+1;while(end<7&&board[r*7+end]?.special!=='rainbow'&&board[r*7+end]?.type===type)end++;if(end-c>=3){const cells=[];for(let x=c;x<end;x++){const i=r*7+x;cells.push(i);hMembership.set(i,cells);}groups.push({dir:'h',cells,type});}c=end;}
    }
    for(let c=0;c<7;c++){
      let r=0;while(r<7){const idx=r*7+c,type=board[idx]?.special==='rainbow'?null:board[idx]?.type;if(!type){r++;continue;}let end=r+1;while(end<7&&board[end*7+c]?.special!=='rainbow'&&board[end*7+c]?.type===type)end++;if(end-r>=3){const cells=[];for(let y=r;y<end;y++){const i=y*7+c;cells.push(i);vMembership.set(i,cells);}groups.push({dir:'v',cells,type});}r=end;}
    }
    const matched=new Set(groups.flatMap(g=>g.cells));return {groups,matched,hMembership,vMembership};
  }

  async function resolveMatches(preferred=[]){
    let chain=0;
    while(true){
      const found=findMatches(game.board);if(!found.groups.length)break;chain++;game.stats=state.stats;state.stats.matches++;
      const creations=new Map();
      const intersections=[...found.matched].filter(i=>found.hMembership.has(i)&&found.vMembership.has(i));
      intersections.forEach(i=>creations.set(i,'bomb'));
      found.groups.forEach(g=>{
        const pick=preferred.find(i=>g.cells.includes(i)) ?? g.cells[Math.floor(g.cells.length/2)];
        if(g.cells.length>=5){creations.set(pick,'rainbow');state.stats.rainbows++;}
      });
      const clearSet=new Set([...found.matched].filter(i=>!creations.has(i)));
      expandSpecials(clearSet);
      await animateClear(clearSet);
      damageCrates(clearSet);
      collectClear(clearSet);
      clearSet.forEach(i=>{if(game.board[i].obstacle==='ice'||game.board[i].obstacle==='mud')game.board[i].obstacle=null;game.board[i].type=null;game.board[i].special=null;});
      creations.forEach((special,i)=>{if(game.board[i].type){game.board[i].special=special;if(special==='rainbow')game.board[i].type='flower';}});
      sound(chain>1?'special':'match');renderGame();showFloatScore(100*clearSet.size*chain);await wait(45);
      await collapseAnimated();
      preferred=[];
    }
    saveState();
  }

  function expandSpecials(clearSet){
    const queue=[...clearSet],seen=new Set(queue);
    while(queue.length){const i=queue.shift(),cell=game.board[i];if(!cell?.special)continue;let targets=[];
      if(cell.special==='row'){const r=Math.floor(i/7);targets=[...Array(7)].map((_,c)=>r*7+c);}
      if(cell.special==='col'){const c=i%7;targets=[...Array(7)].map((_,r)=>r*7+c);}
      if(cell.special==='bomb'){const r=Math.floor(i/7),c=i%7;for(let y=r-1;y<=r+1;y++)for(let x=c-1;x<=c+1;x++)if(y>=0&&y<7&&x>=0&&x<7)targets.push(y*7+x);}
      targets.forEach(t=>{if(game.board[t]?.type&&!seen.has(t)){seen.add(t);clearSet.add(t);queue.push(t);}});
    }
  }
  function collectClear(set){set.forEach(i=>{const type=game.board[i]?.type;if(type&&game.collected[type]!==undefined)game.collected[type]++;});}
  function damageCrates(clearSet){
    const hit=new Set();clearSet.forEach(i=>{[i-7,i+7,i-1,i+1].forEach(n=>{if(isAdjacent(i,n)&&game.board[n]?.obstacle==='crate')hit.add(n);});});
    hit.forEach(i=>{game.board[i].hp--;if(game.board[i].hp<=0)game.board[i]={type:randPiece(),special:null,obstacle:null,hp:0};});
  }
  async function animateClear(clearSet){
    const board=$('#board');
    clearSet.forEach(i=>board.children[i]?.classList.add('clearing'));
    await wait(195);
  }
  function collapse(){
    for(let c=0;c<7;c++){
      const vals=[];
      for(let r=6;r>=0;r--){
        const i=r*7+c,cell=game.board[i];
        if(cell.obstacle==='crate')continue;
        if(cell.type){cell._fromIndex=i;vals.push(cell);}
      }
      let spawnRow=-1;
      for(let r=6;r>=0;r--){
        const i=r*7+c;
        if(game.board[i].obstacle==='crate')continue;
        const existing=vals.shift();
        if(existing) game.board[i]=existing;
        else game.board[i]={type:randPiece(),special:null,obstacle:null,hp:0,_fromIndex:spawnRow--*7+c};
      }
    }
  }
  async function animateFalls(){
    const board=$('#board'),cells=[...board.children],wrappers=[...board.querySelectorAll('.piece-wrap[data-from-index]')];
    if(!wrappers.length)return;
    const pitch=cells[7]&&cells[0]?cells[7].getBoundingClientRect().top-cells[0].getBoundingClientRect().top:0;
    let maxRows=0;
    wrappers.forEach(w=>{
      const to=Number(w.parentElement.dataset.i),from=Number(w.dataset.fromIndex);
      const rows=Math.max(0,Math.floor(to/7)-Math.floor(from/7));maxRows=Math.max(maxRows,rows);
      const dy=(Math.floor(from/7)-Math.floor(to/7))*pitch;
      w.style.transition='none';w.style.transform=`translateY(${dy}px)`;w.style.opacity=from<0?'.35':'1';
    });
    board.offsetHeight;
    await new Promise(requestAnimationFrame);
    wrappers.forEach(w=>{
      const from=Number(w.dataset.fromIndex),to=Number(w.parentElement.dataset.i),rows=Math.max(1,Math.floor(to/7)-Math.floor(from/7));
      const duration=Math.min(520,210+rows*42);
      w.style.transition=`transform ${duration}ms cubic-bezier(.18,.78,.28,1), opacity ${Math.min(duration,260)}ms ease-out`;
      w.style.transform='translateY(0)';w.style.opacity='1';
    });
    await wait(Math.min(560,250+maxRows*44));
    game.board.forEach(cell=>delete cell._fromIndex);
  }
  async function collapseAnimated(){
    collapse();renderGame();await animateFalls();
  }
  async function settleBoard(){await resolveMatches([]);if(!findPossibleMove(game.board)){toast('沒有可移動組合，魔法洗牌！');shuffleBoard(true);await wait(250);}}
  function goalsMet(){return Object.entries(game.cfg.goals).every(([t,n])=>(game.collected[t]||0)>=n);}
  function finishMove(){renderGame();const won=goalsMet();if(hasBonusChallenge()&&bonusChallengeComplete()&&!game.bonusAnnounced){game.bonusAnnounced=true;if(!won)toast('額外寶箱挑戰完成！🎁');}if(won){inputLocked=true;setTimeout(levelWon,350);}else if(game.moves<=0){inputLocked=true;setTimeout(levelFailed,350);}else inputLocked=false;}

  async function activateRainbow(index,targetType){
    const clear=new Set([index]);if(targetType)game.board.forEach((c,i)=>{if(c.type===targetType)clear.add(i);});else game.board.forEach((c,i)=>{if(c.type)clear.add(i);});
    expandSpecials(clear);await animateClear(clear);damageCrates(clear);collectClear(clear);clear.forEach(i=>{if(game.board[i].obstacle!=='crate'){game.board[i].type=null;game.board[i].special=null;game.board[i].obstacle=null;}});sound('special');renderGame();confetti(12);await wait(45);await collapseAnimated();state.stats.rainbows++;saveState();
  }

  function bonusChestInfo(){
    const hasIce=(game.bonusInitial?.ice||0)>0,hasMud=(game.bonusInitial?.mud||0)>0;
    if(hasIce&&hasMud)return {kind:'sparkle',name:'閃亮寶箱',emoji:'✨🎁'};
    if(hasIce)return {kind:'ice',name:'冰晶寶箱',emoji:'🧊🎁'};
    return {kind:'mud',name:'清潔寶箱',emoji:'🧹🎁'};
  }
  function claimBonusReward(level){
    if(!bonusChallengeComplete())return null;
    const info=bonusChestInfo(),key=String(level),previous=state.bonusClaims[key];
    if(previous)return {...info,already:true,reward:previous.reward};
    const reward=Math.random()<.5?'hammer':'shuffle';state.boosters[reward]++;state.treasures[info.kind]++;state.bonusClaims[key]={kind:info.kind,reward};
    return {...info,already:false,reward};
  }
  function unfinishedBonusText(){
    if(!hasBonusChallenge()||bonusChallengeComplete())return '';
    return Object.keys(game.bonusInitial).map(type=>`${type==='ice'?'🧊':'🟤'} 還剩 ${remainingBonus(type)}`).join('、');
  }

  function levelWon(){
    const level=game.cfg.level,first=!state.cleared.includes(level);if(first){state.cleared.push(level);state.stars++;state.unlocked=Math.max(state.unlocked,Math.min(30,level+1));}
    const bonus=claimBonusReward(level);
    if(level%5===0){state.boosters.hammer++;state.boosters.shuffle++;}
    saveState();sound('win');confetti(bonus&&!bonus.already?56:42);const newly=checkStickers();
    let bonusText='';
    if(bonus){const rewardText=bonus.reward==='hammer'?'🔨 小槌子＋1':'🔀 魔法洗牌＋1';bonusText=bonus.already?`<br>${bonus.emoji} ${bonus.name}已在之前領取。`:`<br><strong>額外挑戰完成！</strong><br>${bonus.emoji} 獲得${bonus.name}：${rewardText}`;}
    else if(hasBonusChallenge())bonusText=`<br>🎁 額外寶箱未完成：${unfinishedBonusText()}`;
    const showWinResult=()=>{
      openModal(`<div class="big-emoji">${bonus&&!bonus.already?bonus.emoji:'🎉'}</div><h2>過關成功！</h2><p>${first?'獲得 1 顆夢想星 ⭐':'這一關已經領過夢想星了。'}${level%5===0?'<br>里程碑獎勵：🔨＋1、🔀＋1':''}${bonusText}</p><div class="modal-actions"><button class="secondary" id="winHome">回小屋</button><button class="primary" id="winNext">${level<30?'下一關':'再玩一次'}</button></div>`);
      $('#winHome').addEventListener('click',()=>{closeModal();showScreen('home');});$('#winNext').addEventListener('click',()=>startLevel(level<30?Math.min(level+1,state.unlocked):level));
    };
    if(newly.length)showStickerCelebration(newly,showWinResult);else showWinResult();
  }
  function levelFailed(){const newly=checkStickers();const showFail=()=>{sound('fail');openModal(`<div class="big-emoji">🌷</div><h2>差一點點！</h2><p>再試一次吧。連續消除特殊方塊會更快完成目標。</p><div class="modal-actions"><button class="secondary" id="failHome">先回小屋</button><button class="primary" id="retry">重新挑戰</button></div>`);$('#failHome').addEventListener('click',()=>{closeModal();showScreen('home');});$('#retry').addEventListener('click',()=>startLevel(game.cfg.level));};if(newly.length)showStickerCelebration(newly,showFail);else showFail();}

  function findPossibleMove(board){
    for(let i=0;i<49;i++)for(const j of [i+1,i+7]){if(j>=49||!isAdjacent(i,j)||!board[i].type||!board[j].type||board[i].obstacle==='crate'||board[j].obstacle==='crate')continue;swap(board,i,j);const ok=findMatches(board).groups.length>0;swap(board,i,j);if(ok)return [i,j];}return null;
  }
  function shuffleBoard(free=false){
    if(!free&&state.boosters.shuffle<=0){toast('洗牌道具用完了');return;}
    if(!free){state.boosters.shuffle--;saveState();$('#shuffleCount').textContent=state.boosters.shuffle;}
    const movable=game.board.filter(c=>c.type&&c.obstacle!=='crate');const types=movable.map(c=>c.type).sort(()=>Math.random()-.5);let k=0;game.board.forEach(c=>{if(c.type&&c.obstacle!=='crate'){c.type=types[k++];c.special=null;}});
    let safety=0;while(findMatches(game.board).groups.length&&safety++<20){findMatches(game.board).matched.forEach(i=>{if(game.board[i].type)game.board[i].type=randPiece();});}
    if(!findPossibleMove(game.board)){game.board=createBoard(game.cfg);}sound('special');renderGame();toast('重新排列完成！');
  }
  function showHint(){const move=findPossibleMove(game.board);if(!move){shuffleBoard(true);return;}move.forEach(i=>$('#board').children[i]?.classList.add('hint'));setTimeout(()=>move.forEach(i=>$('#board').children[i]?.classList.remove('hint')),2200);}
  async function useHammer(i){
    hammerMode=false;if(state.boosters.hammer<=0){toast('小槌子用完了');return;}const cell=game.board[i];if(!cell.type&&cell.obstacle!=='crate')return;
    inputLocked=true;state.boosters.hammer--;saveState();$('#hammerCount').textContent=state.boosters.hammer;
    if(cell.obstacle==='crate'){cell.hp--;if(cell.hp<=0)game.board[i]={type:randPiece(),special:null,obstacle:null,hp:0};sound('special');renderGame();await wait(220);}
    else{const one=new Set([i]);await animateClear(one);collectClear(one);cell.type=null;cell.special=null;cell.obstacle=null;sound('special');renderGame();await wait(45);await collapseAnimated();}
    await settleBoard();finishMove();
  }

  function bindHintTargets(root=document){
    root.querySelectorAll('.hint-target').forEach(el=>{
      if(el.dataset.hintBound)return;el.dataset.hintBound='1';
      el.addEventListener('click',e=>{e.stopPropagation();const opening=!el.classList.contains('hint-open');document.querySelectorAll('.hint-target.hint-open').forEach(x=>{x.classList.remove('hint-open');x.setAttribute('aria-expanded','false');});if(opening){el.classList.add('hint-open');el.setAttribute('aria-expanded','true');}});
      el.addEventListener('keydown',e=>{if(e.key==='Escape'){el.classList.remove('hint-open');el.setAttribute('aria-expanded','false');el.blur();}});
    });
  }
  function openModal(html){$('#modal').innerHTML=html;$('#modalLayer').classList.add('show');}
  function closeModal(){$('#modalLayer').classList.remove('show');}
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),1700);}
  function showFloatScore(n){const d=document.createElement('div');d.className='float-score';d.textContent=`+${n}`;d.style.left=`${35+Math.random()*30}%`;d.style.top=`${40+Math.random()*15}%`;$('#app').appendChild(d);setTimeout(()=>d.remove(),800);}
  function confetti(n=24){const c=$('#confetti'),symbols=['🌸','⭐','🎀','✨','💗'];for(let i=0;i<n;i++){const e=document.createElement('i');e.textContent=symbols[Math.floor(Math.random()*symbols.length)];e.style.left=Math.random()*100+'%';e.style.animationDelay=Math.random()*.5+'s';e.style.animationDuration=1.8+Math.random()*1.5+'s';c.appendChild(e);setTimeout(()=>e.remove(),3500);}}

  function openSettings(){
    openModal(`<div class="big-emoji">⚙️</div><h2>遊戲設定</h2><p>進度會自動儲存在這台裝置。</p><div class="choice-grid" style="grid-template-columns:1fr 1fr"><button class="choice ${state.sound?'selected':''}" id="soundToggle"><span class="choice-emoji">${state.sound?'🔊':'🔇'}</span>音效<br><small>${state.sound?'已開啟':'已關閉'}</small></button><button class="choice" id="helpBtn"><span class="choice-emoji">🧚🏻‍♀️</span>玩法說明<small>查看教學</small></button></div><div class="modal-actions"><button class="secondary" id="resetBtn">重設進度</button><button class="primary" id="settingsDone">完成</button></div>`);
    $('#soundToggle').addEventListener('click',()=>{state.sound=!state.sound;saveState();closeModal();openSettings();sound();});
    $('#helpBtn').addEventListener('click',()=>{closeModal();state.tutorialSeen=false;saveState();showScreen('home');$('#tutorial').classList.add('show');});
    $('#settingsDone').addEventListener('click',closeModal);
    $('#resetBtn').addEventListener('click',()=>{if(confirm('確定要清除所有關卡與布置進度嗎？')){state=structuredClone(DEFAULT_STATE);saveState();closeModal();showScreen('home');}});
  }

  function bindUI(){
    $('#playCurrentBtn').addEventListener('click',()=>startLevel(Math.min(state.unlocked,30)));
    $('#sparkleTask').addEventListener('click',()=>{const a=AREAS.find(x=>x.id===state.area),t=currentTask(a);if(t)openBuildModal(a,t,false);});
    $('#settingsBtn').addEventListener('click',openSettings);
    $('#tutorialOk').addEventListener('click',()=>{state.tutorialSeen=true;saveState();$('#tutorial').classList.remove('show');});
    $$('[data-view]').forEach(b=>b.addEventListener('click',()=>showScreen(b.dataset.view)));
    $$('.backHome').forEach(b=>b.addEventListener('click',()=>showScreen('home')));
    $('#quitGameBtn').addEventListener('click',()=>openModal(`<div class="big-emoji">🧩</div><h2>離開這一關嗎？</h2><p>本次關卡進度不會保留，將返回關卡一覽。</p><div class="modal-actions"><button class="secondary" id="stayGame">繼續玩</button><button class="primary" id="leaveGame">回關卡一覽</button></div>`));
    $('#pauseBtn').addEventListener('click',()=>openModal(`<div class="big-emoji">⏸️</div><h2>遊戲暫停</h2><p>休息一下，再繼續完成夢想小屋。</p><div class="modal-actions"><button class="secondary" id="restartLevel">重新開始</button><button class="primary" id="resumeGame">繼續遊戲</button></div>`));
    $('#modal').addEventListener('click',e=>{
      if(e.target.id==='stayGame'||e.target.id==='resumeGame')closeModal();
      if(e.target.id==='leaveGame'){closeModal();showScreen('levels');}
      if(e.target.id==='restartLevel')startLevel(game.cfg.level);
    });
    $('#hintBtn').addEventListener('click',showHint);
    $('#shuffleBtn').addEventListener('click',()=>shuffleBoard(false));
    $('#hammerBtn').addEventListener('click',()=>{if(state.boosters.hammer<=0){toast('小槌子用完了');return;}hammerMode=!hammerMode;toast(hammerMode?'點一下想敲掉的格子':'已取消小槌子');});
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&currentView==='game')inputLocked=true;else if(currentView==='game')inputLocked=false;});
  }

  document.addEventListener('click',()=>document.querySelectorAll('.hint-target.hint-open').forEach(x=>{x.classList.remove('hint-open');x.setAttribute('aria-expanded','false');}));
  bindUI();bindHintTargets(document);renderHome();checkStickers();
})();
</script>
</body>
</html>
